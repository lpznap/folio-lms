services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - '127.0.0.1:1433:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    volumes:
      - library-sql:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      DatabaseProvider: SqlServer
      ConnectionStrings__Library: Server=db;Database=Folio;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Seed__Enabled: 'true'
      Seed__Password: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - api
volumes:
  library-sql:
